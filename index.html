  <body class="bg-stone-100 text-stone-900 antialiased selection:bg-emerald-200">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #064e3b; color: #ffffff; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 80px; height: 80px; border-radius: 24px; background: rgba(16, 185, 129, 0.2); border: 2px solid rgba(52, 211, 153, 0.4); display: flex; align-items: center; justify-content: center; font-size: 38px; margin-bottom: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);">
          🌿
        </div>
        <h1 style="font-size: 24px; font-weight: 800; letter-spacing: -0.025em; margin: 0 0 6px 0; color: #ffffff;">
          AgriScan Ghana
        </h1>
        <p style="font-size: 13px; color: #a7f3d0; margin: 0 0 24px 0; max-width: 320px; line-height: 1.5;">
          Offline Crop Disease Diagnosis & MoFA Treatment Protocols
        </p>
        <div style="width: 140px; height: 4px; background: rgba(255, 255, 255, 0.15); border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="width: 50%; height: 100%; background: #34d399; border-radius: 9999px; animation: agriscanPulse 1.2s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes agriscanPulse {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
            100% { transform: translateX(200%); }
          }
        </style>
        <div style="margin-top: 24px; font-size: 11px; color: #6ee7b7; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600;">
          CSIR-CRI Ghana Verified
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
